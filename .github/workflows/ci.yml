name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: composer lint

      - name: Static analysis
        run: composer analyse

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test
  
  deploy:
  needs: ci
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest
  environment: production

  steps:
    - uses: actions/checkout@v4

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none

    - name: Install production dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

    - name: Package release
      run: tar --exclude=.git --exclude=tests -czf /tmp/release.tar.gz .

    - uses: actions/upload-artifact@v4
      with:
        name: release
        path: /tmp/release.tar.gz

    - name: Deploy (simulated)
      run: |
        echo "Would upload release.tar.gz to the server"
        echo "Would run: php artisan migrate --force"
        echo "Would run: php artisan config:cache && php artisan route:cache"
        echo "Would run: php artisan queue:restart"